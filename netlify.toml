[build]
  command = "npm run build"
  publish = ".next"
  functions = ".netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/ebooks/**"]

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  framework = "next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
